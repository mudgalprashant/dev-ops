# Cell Quake — deploy on release. Authored in dev-ops, COPIED to cellquake/.github/workflows/deploy-release.yml.

name: Deploy to Cloudflare on Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests & typecheck
        run: |
          pnpm test
          pnpm typecheck

      - name: Build web application
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://cellquake.parasm.workers.dev' }}
          VITE_APP_VERSION: ${{ github.ref_name }}
        run: pnpm --filter @cellquake/web build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm dlx wrangler pages deploy apps/web/dist \
            --project-name cellquake \
            --branch main \
            --commit-dirty=true

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/server
