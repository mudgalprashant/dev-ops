# Cellbreak — deploy. Authored in dev-ops, COPIED to cellbreak/.github/workflows/deploy.yml.
#
# Publishes the Worker AND the client as one version. `wrangler deploy` uploads whatever is
# already in apps/web/dist and does not build it, so the build step below is load-bearing:
# without it this workflow would ship the previous client against the new Worker.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never let two deploys race; the later one wins and the earlier is abandoned.
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm --filter @cellquake/web build

      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/server
