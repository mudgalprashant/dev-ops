# Authored in dev-ops. Destination: drovi-backend/.github/workflows/deploy.yml
#
# Builds the jar on GitHub's runner and ships it to the VM over SSH.
#
# The secrets are named DEPLOY_* rather than after the provider on purpose: the
# host has already changed twice, and a workflow that hardcodes a vendor name in
# its secrets makes the next move a rename across three places instead of one
# value change.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never let two deploys interleave on one box.
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build
        run: ./gradlew --no-daemon clean bootJar -x test

      - name: Stage the jar
        run: |
          jar=$(ls build/libs/*.jar | grep -v plain | head -1)
          cp "$jar" drovi-backend.jar

      - name: Authorise the runner
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinning the host key rather than disabling checking: a deploy that
          # trusts any host will happily ship the jar — and nothing else, but
          # still — to whatever answers on that address.
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Ship and restart
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          release="drovi-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}.jar"
          scp drovi-backend.jar "$USER@$HOST:/tmp/$release"
          ssh "$USER@$HOST" bash -euo pipefail <<REMOTE
            sudo mv "/tmp/$release" "/opt/drovi/releases/$release"
            sudo chown drovi:drovi "/opt/drovi/releases/$release"
            # Symlink swap, so rollback is one ln -sf to a previous release
            # rather than a rebuild of whatever main happened to contain.
            sudo ln -sfn "/opt/drovi/releases/$release" /opt/drovi/current.jar
            sudo systemctl restart drovi-backend
            # Keep the last five releases. Disk is 200 GB but unbounded growth
            # in a deploy path is how a box fills up at the worst moment.
            ls -1t /opt/drovi/releases/*.jar | tail -n +6 | sudo xargs -r rm --
          REMOTE

      - name: Verify it actually came back
        env:
          BASE: ${{ secrets.DROVI_PUBLIC_BASE_URL }}
        run: |
          # A restart that fails leaves the OLD process dead and the new one
          # crash-looping. Without this gate the workflow goes green on a site
          # that is down, which is worse than a red build.
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 "$BASE/actuator/health" | grep -q '"status":"UP"'; then
              echo "healthy after ${i}0s"; exit 0
            fi
            sleep 10
          done
          echo "::error::service did not report UP within 5 minutes"
          exit 1
