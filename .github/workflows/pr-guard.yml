name: PR guard

# GitHub cannot restrict who OPENS a pull request, only who merges. This check is the
# substitute: made a required status check, it blocks a merge the branch model forbids.
#
# On this branch (`cellbreak`) it enforces the release rule: the only PR that may land on
# the release branch is the release PR from `cellbreak-dev`.
#
# ⚠️ Keep the job name `release-prs-come-from-dev` exactly as it is. It is the string
# selected in branch protection as the required check; renaming it per project means
# renaming it in the GitHub UI too, for no gain.

on:
  pull_request:
    branches: [cellbreak]

permissions:
  contents: read

jobs:
  release-prs-come-from-dev:
    runs-on: ubuntu-latest
    steps:
      - name: The release branch takes one PR, and it comes from cellbreak-dev
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "head: $HEAD_REF  →  base: $BASE_REF"
          if [ "$HEAD_REF" = "cellbreak-dev" ]; then
            echo "OK — the release PR."
            exit 0
          fi
          echo "::error::'$HEAD_REF' cannot merge into 'cellbreak'. Work lands on cellbreak-dev via a feat/ or fix/ PR first, and cellbreak-dev → cellbreak is the one release PR, merged by a human. See docs/branching-strategy.md."
          exit 1
