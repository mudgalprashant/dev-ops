name: PR guard

# dev-ops is a shared repo with one branch per project, so this project's RELEASE branch
# is `bidceleb`, not `main`, and its integration branch is `bidceleb-dev`.
#
# GitHub cannot restrict who OPENS a pull request, only who merges. This check is the
# substitute: made a required status check, a PR into `bidceleb` that skipped
# `bidceleb-dev` cannot be merged.
#
# ⚠️ The job name `release-prs-come-from-dev` is the string selected in branch protection
# as the required check. It is identical across projects on purpose — keep it.

on:
  pull_request:
    branches: [bidceleb]

permissions:
  contents: read

jobs:
  release-prs-come-from-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Only `bidceleb-dev` may target `bidceleb`
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "head: $HEAD_REF  →  base: $BASE_REF"
          if [ "$HEAD_REF" != "bidceleb-dev" ]; then
            echo "::error::A pull request into 'bidceleb' may only come from 'bidceleb-dev'."
            exit 1
          fi
          echo "OK — release PR from bidceleb-dev."
